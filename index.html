<!-- This goes into Squarespace Block -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/davidthefuturist/tuner-i-just-met-her@main/web/style.css">

<div id="vesc-container">
    <div id="status" class="status">NOT CONNECTED</div>
    <button onclick="connectBLE()" style="width:100%; padding:10px; margin-bottom:10px;">Connect BLE</button>
    
    <section>
        <label>DUTY CYCLE</label>
        <input type="number" id="duty" placeholder="0" onkeydown="if(event.key==='Enter') sendData('DUTY','duty')">
    </section>

    <section>
        <label>CURRENT LIMIT</label>
        <input type="number" id="clim" placeholder="20" onkeydown="if(event.key==='Enter') sendData('CLIM','clim')">
    </section>

    <button class="btn-stop" onclick="document.getElementById('duty').value=0; sendData('DUTY','duty')">STOP</button>
</div>

<script src="https://cdn.jsdelivr.net/gh/davidthefuturist/tuner-i-just-met-her@main/web/app.js"></script>
